name: CI - Testes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit-tests:
    name: Testes Unitários
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - run: npm run test:unit

      - name: Alerta de sucesso
        if: success()
        run: echo "✅ Todos os testes unitários passaram com sucesso!"

      - name: Alerta de falha
        if: failure()
        run: echo "❌ FALHA nos testes unitários! Verifique os logs."

  integration-tests:
    name: Testes de Integração
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - run: npm run test:integration

      - name: Alerta de sucesso
        if: success()
        run: echo "✅ Todos os testes de integração passaram!"

      - name: Alerta de falha
        if: failure()
        run: echo "❌ FALHA nos testes de integração! Verifique os logs."

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - run: npm run build